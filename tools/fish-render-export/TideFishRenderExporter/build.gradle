plugins {
    id 'fabric-loom' version '1.10.5'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation("me.shedaniel.cloth:cloth-config-fabric:15.0.140") {
        exclude group: 'net.fabricmc.fabric-api'
    }
    modImplementation "maven.modrinth:die1AF7i:ztNu3GtG"
    modImplementation "maven.modrinth:HH4FjUqN:F5POkJG0"
    modImplementation "maven.modrinth:Yd4wb5wZ:ih64rzUz"
    modImplementation "maven.modrinth:Ha28R6CL:bdhiINYC"
}

loom {
    runs {
        client {
            runDir = "run/client"
        }
        server {
            runDir = "run/server"
        }
        renderClient {
            client()
            configName = "Fish Render Client"
            runDir = "run/client"
            programArg "--quickPlaySingleplayer"
            programArg "RenderWorld"
            programArg "--width"
            programArg "1280"
            programArg "--height"
            programArg "720"
            environmentVariable("TIDE_FISH_RENDER_AUTO", "tide:tuna")
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
    def repoRegistry = file("${projectDir}/../../../fish/render-data/registry/supported-fish-registry.json")
    if (repoRegistry.exists()) {
        from(repoRegistry) {
            into 'fishrender'
            rename { 'fish-render-registry.json' }
        }
    }
    from("${projectDir}/../../../fish/render-data/modpack-scope.json") {
        into 'fishrender'
    }
    from("${projectDir}/../../../assets/fish-search-index.json") {
        into 'fishrender'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

