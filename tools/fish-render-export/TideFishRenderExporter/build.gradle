plugins {
    id 'fabric-loom' version '1.17.12'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

// Capture external profile inputs before defining ext properties with the same names.
def hybridAquaticVersionOverride = project.findProperty('hybridAquaticVersion')
def hybridAquaticModrinthOverride = project.findProperty('hybridAquaticModrinthVersion')
def hybridAquaticJarOverride = project.findProperty('hybridAquaticJar')
def hybridAquaticNamespaceOverride = project.findProperty('hybridAquaticNamespaceMode')

ext {
    // Baseline runtime used for the normal Hybrid Aquatic catalog.
    hybridAquaticVersion = (hybridAquaticVersionOverride ?: '1.5.5').toString()
    hybridAquaticModrinthVersion = (hybridAquaticModrinthOverride ?: '6EfLaKkB').toString()
    hybridAquaticJar = (hybridAquaticJarOverride ?: '').toString()
    // 1.5.5 registers runtime entity IDs with hybrid-aquatic. Later runtimes use
    // the canonical hybrid_aquatic namespace. Workflows select this explicitly.
    hybridAquaticNamespaceMode = (hybridAquaticNamespaceOverride ?: 'hyphenated').toString()
    includeHybridAquatic = !project.hasProperty('skipHybridAquatic')
}

if (!(hybridAquaticNamespaceMode in ['hyphenated', 'canonical'])) {
    throw new GradleException("Unsupported hybridAquaticNamespaceMode=${hybridAquaticNamespaceMode}; expected hyphenated or canonical")
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.ladysnake.org/releases' }
    maven { url = 'https://maven.isxander.dev/releases' }
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation("me.shedaniel.cloth:cloth-config-fabric:15.0.140") {
        exclude group: 'net.fabricmc.fabric-api'
    }
    modImplementation "maven.modrinth:die1AF7i:ztNu3GtG"

    // Hybrid Aquatic 1.5.5 is the stable baseline. A renderer workflow may provide
    // an explicit local jar/profile for a later runtime without rewriting this file.
    if (includeHybridAquatic) {
        if (hybridAquaticJar) {
            modImplementation files(hybridAquaticJar)
        } else {
            modImplementation "maven.modrinth:HH4FjUqN:${hybridAquaticModrinthVersion}"
        }
    }

    modImplementation "maven.modrinth:Yd4wb5wZ:ih64rzUz"
    modImplementation "net.fabricmc:fabric-language-kotlin:1.13.13+kotlin.2.4.10"
    modImplementation "dev.isxander:yet-another-config-lib:3.8.1+1.21.1-fabric"
    modImplementation "maven.modrinth:lhGA9TYQ:Wto0RchG"
    modImplementation "maven.modrinth:8BmcQJ2H:sLlRgyS8"
    modImplementation "maven.modrinth:XaDC71GB:7FWLrZRG"
    modImplementation "maven.modrinth:iGEl6Crx:Tgfz9ihs"
    modImplementation "maven.modrinth:5aaWibi9:JagCscwi"
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-base:6.1.3"
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:6.1.3"
}

loom {
    runs {
        client {
            runDir = "run/client"
        }
        server {
            runDir = "run/server"
        }
        renderClient {
            client()
            configName = "Fish Render Client"
            runDir = "run/client"
            programArg "--quickPlaySingleplayer"
            programArg "RenderWorld"
            programArg "--width"
            programArg "1024"
            programArg "--height"
            programArg "1024"
            environmentVariable("TIDE_FISH_RENDER_AUTO", "scope")
        }
        renderTideTuna {
            client()
            configName = "Tide Tuna Smoke Render"
            runDir = "run/client"
            programArg "--quickPlaySingleplayer"
            programArg "RenderWorld"
            programArg "--width"
            programArg "1024"
            programArg "--height"
            programArg "1024"
            environmentVariable("TIDE_FISH_RENDER_AUTO", "tide:tuna")
        }
        runtimeBundleTideTuna {
            client()
            configName = "Runtime Bundle Tide Tuna Smoke"
            runDir = "run/client"
            programArg "--quickPlaySingleplayer"
            programArg "RenderWorld"
            programArg "--width"
            programArg "1024"
            programArg "--height"
            programArg "1024"
            environmentVariable("TIDE_FISH_RUNTIME_AUTO", "true")
            environmentVariable("TIDE_FISH_RUNTIME_FILTER", "tide:tuna")
            environmentVariable("TIDE_FISH_RUNTIME_EXIT_AFTER_EXPORT", "true")
        }
        renderHybridOarfish {
            client()
            configName = "Hybrid Aquatic Oarfish Smoke Render"
            runDir = "run/client"
            programArg "--quickPlaySingleplayer"
            programArg "RenderWorld"
            programArg "--width"
            programArg "1024"
            programArg "--height"
            programArg "1024"
            environmentVariable("TIDE_FISH_RENDER_AUTO", "hybrid_aquatic:oarfish")
        }
        renderHybrid {
            client()
            configName = "Hybrid Aquatic Render Client"
            runDir = "run/client"
            programArg "--quickPlaySingleplayer"
            programArg "RenderWorld"
            programArg "--width"
            programArg "1024"
            programArg "--height"
            programArg "1024"
            environmentVariable("TIDE_FISH_RENDER_AUTO", "namespace:hybrid_aquatic")
        }
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'hybridAquaticVersion', hybridAquaticVersion
    inputs.property 'hybridAquaticNamespaceMode', hybridAquaticNamespaceMode
    def repoRegistry = file("${projectDir}/../../../fish/render-data/registry/supported-fish-registry.json")
    if (repoRegistry.exists()) {
        from(repoRegistry) {
            into 'fishrender'
            rename { 'fish-render-registry.json' }
            filter { line ->
                hybridAquaticNamespaceMode == 'hyphenated'
                        ? line.replace('"entity_id": "hybrid_aquatic:', '"entity_id": "hybrid-aquatic:')
                        : line
            }
        }
    }
    from("${projectDir}/../../../fish/render-data/modpack-scope.json") {
        into 'fishrender'
    }
    from("${projectDir}/../../../assets/fish-search-index.json") {
        into 'fishrender'
    }
}

tasks.register('verifyHybridAquaticPin') {
    group = 'verification'
    description = 'Verifies the default renderer profile remains pinned to Hybrid Aquatic 1.5.5.'
    doLast {
        boolean overridden = (
                hybridAquaticVersionOverride != null
                || hybridAquaticModrinthOverride != null
                || hybridAquaticJarOverride != null
                || hybridAquaticNamespaceOverride != null
        )
        if (overridden) {
            println "HYBRID_AQUATIC_PROFILE_OVERRIDE version=${hybridAquaticVersion} modrinth=${hybridAquaticModrinthVersion} jar=${hybridAquaticJar ?: 'maven'} namespace_mode=${hybridAquaticNamespaceMode}"
            return
        }
        if (hybridAquaticVersion != '1.5.5' || hybridAquaticModrinthVersion != '6EfLaKkB' || hybridAquaticNamespaceMode != 'hyphenated') {
            throw new GradleException("Hybrid Aquatic baseline pin changed: version=${hybridAquaticVersion} modrinth=${hybridAquaticModrinthVersion} namespace_mode=${hybridAquaticNamespaceMode}")
        }
        println "HYBRID_AQUATIC_PIN_OK version=${hybridAquaticVersion} modrinth=${hybridAquaticModrinthVersion} namespace_mode=${hybridAquaticNamespaceMode}"
    }
}

check.dependsOn tasks.named('verifyHybridAquaticPin')

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
