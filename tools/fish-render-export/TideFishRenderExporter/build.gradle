plugins {
    id 'fabric-loom' version '1.17.12'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

ext {
    hybridAquaticVersion = '1.5.5'
    hybridAquaticModrinthVersion = '6EfLaKkB'
    includeHybridAquatic = !project.hasProperty('skipHybridAquatic')
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.ladysnake.org/releases' }
    maven { url = 'https://maven.isxander.dev/releases' }
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation("me.shedaniel.cloth:cloth-config-fabric:15.0.140") {
        exclude group: 'net.fabricmc.fabric-api'
    }
    modImplementation "maven.modrinth:die1AF7i:ztNu3GtG"
    // Hybrid Aquatic 1.5.5 is deliberately pinned. The 1.6.9 1.21.1 artifact
    // crashes before world creation because ArgonautEntity overrides the now-final
    // Entity#setGlowing(boolean), so it must not be used by this renderer.
    if (includeHybridAquatic) {
        modImplementation "maven.modrinth:HH4FjUqN:${hybridAquaticModrinthVersion}"
    }
    modImplementation "maven.modrinth:Yd4wb5wZ:ih64rzUz"
    modImplementation "net.fabricmc:fabric-language-kotlin:1.13.13+kotlin.2.4.10"
    modImplementation "dev.isxander:yet-another-config-lib:3.8.1+1.21.1-fabric"
    modImplementation "maven.modrinth:lhGA9TYQ:Wto0RchG"
    modImplementation "maven.modrinth:8BmcQJ2H:sLlRgyS8"
    modImplementation "maven.modrinth:XaDC71GB:7FWLrZRG"
    modImplementation "maven.modrinth:iGEl6Crx:Tgfz9ihs"
    modImplementation "maven.modrinth:5aaWibi9:JagCscwi"
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-base:6.1.3"
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:6.1.3"
}

loom {
    runs {
        client {
            runDir = "run/client"
        }
        server {
            runDir = "run/server"
        }
        renderClient {
            client()
            configName = "Fish Render Client"
            runDir = "run/client"
            programArg "--quickPlaySingleplayer"
            programArg "RenderWorld"
            programArg "--width"
            programArg "1024"
            programArg "--height"
            programArg "1024"
            environmentVariable("TIDE_FISH_RENDER_AUTO", "scope")
        }
        renderHybridOarfish {
            client()
            configName = "Hybrid Aquatic Oarfish Smoke Render"
            runDir = "run/client"
            programArg "--quickPlaySingleplayer"
            programArg "RenderWorld"
            programArg "--width"
            programArg "1024"
            programArg "--height"
            programArg "1024"
            environmentVariable("TIDE_FISH_RENDER_AUTO", "hybrid_aquatic:oarfish")
        }
        renderHybrid {
            client()
            configName = "Hybrid Aquatic Render Client"
            runDir = "run/client"
            programArg "--quickPlaySingleplayer"
            programArg "RenderWorld"
            programArg "--width"
            programArg "1024"
            programArg "--height"
            programArg "1024"
            environmentVariable("TIDE_FISH_RENDER_AUTO", "namespace:hybrid_aquatic")
        }
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'hybridAquaticVersion', hybridAquaticVersion
    def repoRegistry = file("${projectDir}/../../../fish/render-data/registry/supported-fish-registry.json")
    if (repoRegistry.exists()) {
        from(repoRegistry) {
            into 'fishrender'
            rename { 'fish-render-registry.json' }
            // Tide Extra Compatibility / the website use canonical hybrid_aquatic fish IDs,
            // while Hybrid Aquatic 1.5.5 registers runtime entities under hybrid-aquatic.
            // Rewrite only entity_id in the exporter's packaged registry. Fish IDs stay
            // canonical so filenames, wiki IDs, and Tide data remain stable.
            filter { line -> line.replace('"entity_id": "hybrid_aquatic:', '"entity_id": "hybrid-aquatic:') }
        }
    }
    from("${projectDir}/../../../fish/render-data/modpack-scope.json") {
        into 'fishrender'
    }
    from("${projectDir}/../../../assets/fish-search-index.json") {
        into 'fishrender'
    }
}

tasks.register('verifyHybridAquaticPin') {
    group = 'verification'
    description = 'Fails if the runtime renderer is not pinned to the approved Hybrid Aquatic 1.5.5 artifact.'
    doLast {
        if (hybridAquaticVersion != '1.5.5' || hybridAquaticModrinthVersion != '6EfLaKkB') {
            throw new GradleException("Hybrid Aquatic renderer pin changed: version=${hybridAquaticVersion} modrinth=${hybridAquaticModrinthVersion}")
        }
        println "HYBRID_AQUATIC_PIN_OK version=${hybridAquaticVersion} modrinth=${hybridAquaticModrinthVersion}"
    }
}

check.dependsOn tasks.named('verifyHybridAquaticPin')

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
