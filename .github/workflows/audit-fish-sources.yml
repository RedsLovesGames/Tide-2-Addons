name: Audit Fish Wiki Sources

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/audit-fish-sources.yml
      - tools/fish-render-source/source-manifest.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download authoritative sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .fish-source-audit/tide-extra .fish-source-audit/tide
          curl --fail --location --retry 3 \
            'https://cdn.modrinth.com/data/goMfyYSL/versions/Uz6Vlhjs/Tide%20Extra%20Compatibility%202.2.zip' \
            -o /tmp/tide-extra.zip
          unzip -q /tmp/tide-extra.zip -d .fish-source-audit/tide-extra
          curl --fail --location --retry 3 \
            'https://github.com/Lightning-64/Tide-2/archive/876b95f31328f4e698d5150f7d840ab033d1b06d.zip' \
            -o /tmp/tide.zip
          unzip -q /tmp/tide.zip -d .fish-source-audit/tide

      - name: Record source inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-artifacts
          {
            echo '# Authoritative Fish Source Inventory'
            echo
            echo 'Generated from Tide 2 pinned commit 876b95f31328f4e698d5150f7d840ab033d1b06d and Tide Extra Compatibility 2.2.0 Modrinth version Uz6Vlhjs.'
            echo
            echo '## Tide Extra Compatibility files'
            find .fish-source-audit/tide-extra -type f -printf '%P\n' | sort
            echo
            echo '## Tide fish/profile candidate files'
            find .fish-source-audit/tide -type f \( -path '*/fishing/fish/*' -o -path '*/fishing/profile/*' -o -path '*/fish_data/*' \) -printf '%P\n' | sort
          } > audit-artifacts/fish-source-inventory.txt
          rm -rf .fish-source-audit

      - name: Upload source inventory
        uses: actions/upload-artifact@v4
        with:
          name: fish-source-inventory
          path: audit-artifacts/fish-source-inventory.txt
          if-no-files-found: error
          retention-days: 30
