name: Audit Fish Wiki Sources

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/audit-fish-sources.yml
      - tools/fish-render-source/source-manifest.json
      - tools/fish-render-source/download_sources.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download and extract pinned FishData sources
        run: |
          set -euo pipefail
          rm -rf .fish-source-audit
          mkdir -p .fish-source-audit/mods .fish-source-audit/tide .fish-source-audit/tide-extra
          python tools/fish-render-source/download_sources.py \
            --id tide \
            --id tide_extra_compatibility \
            --out .fish-source-audit/mods \
            --resolved-manifest .fish-source-audit/resolved.json
          python - <<'PY'
          import json, pathlib, zipfile
          root = pathlib.Path('.fish-source-audit')
          resolved = json.loads((root / 'resolved.json').read_text())
          by_id = {row['id']: row for row in resolved['sources']}
          for source_id, dest in [('tide', 'tide'), ('tide_extra_compatibility', 'tide-extra')]:
              with zipfile.ZipFile(root / 'mods' / by_id[source_id]['filename']) as z:
                  z.extractall(root / dest)
          PY

      - name: Record source inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-artifacts
          {
            echo '# Authoritative Fish Source Inventory'
            echo
            echo 'Generated from tools/fish-render-source/source-manifest.json with SHA-256 verification.'
            echo
            echo '## Resolved manifest'
            cat .fish-source-audit/resolved.json
            echo
            echo '## Tide Extra Compatibility files'
            find .fish-source-audit/tide-extra -type f -printf '%P\n' | sort
            echo
            echo '## Tide fish/profile candidate files'
            find .fish-source-audit/tide -type f \( -path '*/fishing/fish/*' -o -path '*/fishing/profile/*' -o -path '*/fish_data/*' \) -printf '%P\n' | sort
          } > audit-artifacts/fish-source-inventory.txt
          cp .fish-source-audit/resolved.json audit-artifacts/resolved-source-manifest.json
          rm -rf .fish-source-audit

      - name: Upload source inventory
        uses: actions/upload-artifact@v4
        with:
          name: fish-source-inventory
          path: audit-artifacts/
          if-no-files-found: error
          retention-days: 30
