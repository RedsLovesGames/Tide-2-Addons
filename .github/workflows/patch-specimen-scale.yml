name: Patch specimen scale

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/patch-specimen-scale.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Set 18-block specimen scale and bust cache
        run: |
          python - <<'PY'
          from pathlib import Path

          js = Path('assets/fish-specimen-lab-stable.js')
          text = js.read_text(encoding='utf-8')
          old = 'const FIXED_MAX_CM=600,'
          new = 'const FIXED_MAX_CM=1800,'
          if old not in text and new not in text:
              raise SystemExit('FIXED_MAX_CM token not found')
          text = text.replace(old, new, 1)
          js.write_text(text, encoding='utf-8')

          page = Path('fish/index.html')
          html = page.read_text(encoding='utf-8')
          html = html.replace('fish-specimen-lab-stable.css?v=2', 'fish-specimen-lab-stable.css?v=3')
          html = html.replace('fish-specimen-lab-stable.js?v=1', 'fish-specimen-lab-stable.js?v=2')
          page.write_text(html, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/fish-specimen-lab-stable.js fish/index.html
          if git diff --cached --quiet; then
            echo 'Specimen scale already patched.'
          else
            git commit -m 'Use 18-block specimen scale'
            git push origin HEAD:dev
          fi
