name: Build Tide Fish Render Exporter

on:
  push:
    branches: [fish-render-source-import]
    paths:
      - '.github/workflows/build-fish-render-exporter.yml'
      - 'tools/fish-render-export/TideFishRenderExporter/**'
      - 'fish/render-data/registry/supported-fish-registry.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-exporter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/fish-render-export/TideFishRenderExporter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-read-only: false

      - name: Compile and remap exporter
        run: gradle --no-daemon clean build

      - name: Validate exporter JAR contents
        run: |
          set -euo pipefail
          JAR=$(find build/libs -maxdepth 1 -type f -name 'tide-fish-render-exporter-*.jar' ! -name '*-sources.jar' | head -1)
          test -n "$JAR"
          jar tf "$JAR" | grep -F 'fabric.mod.json'
          jar tf "$JAR" | grep -F 'com/redslovesgames/tidefishrender/RenderService.class'
          jar tf "$JAR" | grep -F 'fishrender/fish-render-registry.json'
          echo "EXPORTER_JAR=$JAR"

      - name: Package source project
        run: |
          set -euo pipefail
          rm -rf ../../../render-exporter-artifact
          mkdir -p ../../../render-exporter-artifact
          cp build/libs/tide-fish-render-exporter-*.jar ../../../render-exporter-artifact/
          cd ..
          zip -qr ../../render-exporter-artifact/TideFishRenderExporter-source.zip TideFishRenderExporter \
            -x 'TideFishRenderExporter/.gradle/*' 'TideFishRenderExporter/build/*'
          cp ../../fish/render-data/registry/supported-fish-registry.json ../../render-exporter-artifact/fish-render-registry.json
          find ../../render-exporter-artifact -maxdepth 1 -type f -print

      - uses: actions/upload-artifact@v4
        with:
          name: tide-fish-render-exporter
          path: render-exporter-artifact/
          if-no-files-found: error
          retention-days: 30
