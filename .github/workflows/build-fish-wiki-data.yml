name: Build Fish Wiki Data

on:
  push:
    branches: [dev]
    paths:
      - scripts/build-fish-wiki.py
      - assets/fish-wiki-data-0.json.gz
      - assets/fish-wiki-data-1.json.gz
      - assets/fish-search-index.json
      - .github/workflows/build-fish-wiki-data.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/build-fish-wiki.py
      - assets/fish-wiki-data-0.json.gz
      - assets/fish-wiki-data-1.json.gz
      - assets/fish-search-index.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download authoritative sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fishsrc/extra /tmp/fishsrc/tide
          curl --fail --location --retry 3 'https://cdn.modrinth.com/data/goMfyYSL/versions/Uz6Vlhjs/Tide%20Extra%20Compatibility%202.2.zip' -o /tmp/extra.zip
          unzip -q /tmp/extra.zip -d /tmp/fishsrc/extra
          curl --fail --location --retry 3 'https://github.com/Lightning-64/Tide-2/archive/876b95f31328f4e698d5150f7d840ab033d1b06d.zip' -o /tmp/tide.zip
          unzip -q /tmp/tide.zip -d /tmp/fishsrc/tide
          TIDE_ROOT="$(find /tmp/fishsrc/tide -type d -path '*/src/generated-1.21.1/resources' -print -quit)"
          test -n "$TIDE_ROOT"
          echo "TIDE_ROOT=$TIDE_ROOT" >> "$GITHUB_ENV"

      - name: Generate Fish Wiki payload into temporary output
        run: |
          mkdir -p /tmp/fish-build-out
          python scripts/build-fish-wiki.py \
            --tide-root "$TIDE_ROOT" \
            --extra-root /tmp/fishsrc/extra \
            --out /tmp/fish-build-out \
            --report /tmp/fish-build-report.txt

      - name: Validate generated payload
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet Pillow
          cp assets/fish-wiki-data-0.json.gz /tmp/committed-0.gz
          cp assets/fish-wiki-data-1.json.gz /tmp/committed-1.gz
          cp assets/fish-search-index.json /tmp/committed-search.json
          cmp /tmp/fish-build-out/fish-wiki-data-0.json.gz /tmp/committed-0.gz
          cmp /tmp/fish-build-out/fish-wiki-data-1.json.gz /tmp/committed-1.gz
          cmp /tmp/fish-build-out/fish-search-index.json /tmp/committed-search.json
          python scripts/validate-fish-wiki.py
          echo 'FISH_WIKI_REPRODUCIBLE=1'

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fish-wiki-data-rebuild
          path: |
            /tmp/fish-build-out/
            /tmp/fish-build-report.txt
          if-no-files-found: warn
          retention-days: 14
