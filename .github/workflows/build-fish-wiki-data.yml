name: Build Fish Wiki Data

on:
  push:
    branches: [fish-wiki-production]
    paths:
      - scripts/build-fish-wiki.py
      - .github/workflows/build-fish-wiki-data.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fish-wiki-production
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download authoritative sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fishsrc/extra /tmp/fishsrc/tide
          curl --fail --location --retry 3 'https://cdn.modrinth.com/data/goMfyYSL/versions/Uz6Vlhjs/Tide%20Extra%20Compatibility%202.2.zip' -o /tmp/extra.zip
          unzip -q /tmp/extra.zip -d /tmp/fishsrc/extra
          curl --fail --location --retry 3 'https://github.com/Lightning-64/Tide-2/archive/876b95f31328f4e698d5150f7d840ab033d1b06d.zip' -o /tmp/tide.zip
          unzip -q /tmp/tide.zip -d /tmp/fishsrc/tide
          TIDE_ROOT="$(find /tmp/fishsrc/tide -type d -path '*/src/generated-1.21.1/resources' -print -quit)"
          test -n "$TIDE_ROOT"
          echo "TIDE_ROOT=$TIDE_ROOT" >> "$GITHUB_ENV"
      - name: Generate Fish Wiki payload
        run: python scripts/build-fish-wiki.py --tide-root "$TIDE_ROOT" --extra-root /tmp/fishsrc/extra --out assets
      - name: Validate generated payload
        shell: bash
        run: |
          python -m pip install --quiet Pillow
          node --check assets/fish-wiki.js
          node --check assets/fish-site-search.js
          python scripts/validate-fish-wiki.py
      - name: Commit generated payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/fish-wiki-data-0.json.gz assets/fish-wiki-data-1.json.gz assets/fish-search-index.json scripts/fish-build-report.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Build authoritative Fish Wiki data'
          git push origin HEAD:fish-wiki-production
