name: Build Fish Wiki Data

on:
  push:
    branches: [dev]
    paths:
      - scripts/build-fish-wiki.py
      - tools/fish-render-source/source-manifest.json
      - tools/fish-render-source/download_sources.py
      - assets/fish-wiki-data-0.json.gz
      - assets/fish-wiki-data-1.json.gz
      - assets/fish-search-index.json
      - .github/workflows/build-fish-wiki-data.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/build-fish-wiki.py
      - tools/fish-render-source/source-manifest.json
      - tools/fish-render-source/download_sources.py
      - assets/fish-wiki-data-0.json.gz
      - assets/fish-wiki-data-1.json.gz
      - assets/fish-search-index.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download pinned Tide FishData sources
        run: |
          set -euo pipefail
          rm -rf /tmp/fishsrc
          mkdir -p /tmp/fishsrc/mods /tmp/fishsrc/tide /tmp/fishsrc/extra
          python tools/fish-render-source/download_sources.py \
            --manifest tools/fish-render-source/source-manifest.json \
            --id tide \
            --id tide_extra_compatibility \
            --out /tmp/fishsrc/mods \
            --resolved-manifest /tmp/fishsrc/resolved.json
          python - <<'PY'
          import json, pathlib, zipfile
          root = pathlib.Path('/tmp/fishsrc')
          resolved = json.loads((root / 'resolved.json').read_text())
          by_id = {row['id']: row for row in resolved['sources']}
          for source_id, dest in [('tide', 'tide'), ('tide_extra_compatibility', 'extra')]:
              row = by_id[source_id]
              archive = root / 'mods' / row['filename']
              with zipfile.ZipFile(archive) as z:
                  z.extractall(root / dest)
          print('FISH_WIKI_SOURCE_ARCHIVES_OK', {k: by_id[k]['resolved_sha256'] for k in by_id})
          PY

      - name: Generate Fish Wiki payload into temporary output
        run: |
          rm -rf /tmp/fish-build-out
          mkdir -p /tmp/fish-build-out
          python scripts/build-fish-wiki.py \
            --tide-root /tmp/fishsrc/tide \
            --extra-root /tmp/fishsrc/extra \
            --out /tmp/fish-build-out \
            --report /tmp/fish-build-report.txt

      - name: Validate deterministic generated payload
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet Pillow
          cmp /tmp/fish-build-out/fish-wiki-data-0.json.gz assets/fish-wiki-data-0.json.gz
          cmp /tmp/fish-build-out/fish-wiki-data-1.json.gz assets/fish-wiki-data-1.json.gz
          cmp /tmp/fish-build-out/fish-search-index.json assets/fish-search-index.json
          python scripts/validate-fish-wiki.py
          echo 'FISH_WIKI_REPRODUCIBLE=1'

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fish-wiki-data-rebuild
          path: |
            /tmp/fish-build-out/
            /tmp/fish-build-report.txt
            /tmp/fishsrc/resolved.json
          if-no-files-found: warn
          retention-days: 14
