name: Validate repository and Fish Wiki

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install image decoder
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Check repository whitespace
        run: git show --check --oneline --no-renames HEAD

      - name: Check Python syntax
        run: |
          python -m py_compile \
            scripts/build-fish-wiki.py \
            scripts/validate-fish-wiki.py \
            scripts/validate-fish-render-manifest.py \
            scripts/validate-repo-structure.py \
            tools/fish-render-source/download_sources.py \
            tools/fish-render-source/extract_fish_render_sources.py

      - name: Check JavaScript syntax
        run: npm run check:js

      - name: Validate repository architecture
        run: python scripts/validate-repo-structure.py

      - name: Validate Fish Wiki payload
        run: python scripts/validate-fish-wiki.py

      - name: Validate source-backed render manifest
        run: python scripts/validate-fish-render-manifest.py
