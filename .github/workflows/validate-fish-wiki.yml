name: Validate Fish Wiki

on:
  push:
    branches:
      - fish-wiki-production
      - bugfix/fish-wiki-ux-pass
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image decoder
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Check JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/specimens.js
          node --check assets/fish-site-search.js
          node --check assets/fish-wiki.js
          node --check assets/fish-wiki-v2.js
          node --check assets/latest-1357.js
          node --check assets/bugfix-ux.js

      - name: Validate Fish Wiki payload
        run: python scripts/validate-fish-wiki.py

      - name: Validate source-backed render manifest
        run: python scripts/validate-fish-render-manifest.py
