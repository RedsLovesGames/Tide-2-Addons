name: Validate Fish Wiki

on:
  push:
    branches:
      - fish-wiki-production
      - bugfix/fish-wiki-ux-pass
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image decoder
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Run deterministic repository validation
        run: npm run validate
