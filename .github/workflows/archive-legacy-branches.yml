name: Archive legacy branches

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  archive:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Archive and delete legacy branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "bugfix/fish-wiki-ux-pass"
            "fish-render-source-import"
            "fish-wiki-build-assets"
            "fish-wiki-production"
            "tideborne-site-redesign"
          )

          for branch in "${branches[@]}"; do
            echo "Archiving ${branch}"
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha' 2>/dev/null || true)"
            if [[ -z "${sha}" ]]; then
              echo "${branch} is already absent; skipping"
              continue
            fi

            tag="archive/${branch//\//-}"
            if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
              gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${tag}" -f sha="${sha}"
            fi

            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          done
