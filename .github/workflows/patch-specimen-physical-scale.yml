name: Patch specimen lab physical scale

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/patch-specimen-physical-scale.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Calibrate specimen lab to Minecraft block scale
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path = Path('assets/fish-specimen-lab.js')
          s = js_path.read_text()

          old = "const p=clamp(Number(percentile)||0,0,100);"
          new = "const rawPercentile=clamp(Number(percentile)||0,0,100);\n  const p=condition==='perfect_specimen'?Math.max(95,rawPercentile):rawPercentile;"
          assert old in s
          s = s.replace(old, new, 1)

          old = '''          <div class="fish-lab-render-stage" data-live-render-stage>\n            <div class="fish-lab-orbit"></div>\n            <div class="fish-lab-render-shell" data-live-render-shell>${preview}</div>\n            <div class="fish-lab-render-meta">\n              <span data-live-render-note>${initialVariant?'Source-authentic normal render':'Render unavailable'}</span>\n              <strong data-live-scale>1.00× display scale</strong>\n            </div>\n          </div>'''
          new = '''          <div class="fish-lab-render-stage" data-live-render-stage>\n            <div class="fish-lab-depth-grid" aria-hidden="true"></div>\n            <div class="fish-lab-orbit"></div>\n            <div class="fish-lab-render-shell" data-live-render-shell>${preview}</div>\n            <div class="fish-lab-scale-reference" aria-label="Minecraft size reference: one block equals one meter or one hundred centimeters">\n              <span class="fish-lab-block-icon" aria-hidden="true"></span>\n              <div class="fish-lab-ruler">\n                <span class="fish-lab-ruler-ticks" aria-hidden="true"></span>\n                <div><strong>1 BLOCK</strong><em>100 cm · 1 m</em></div>\n              </div>\n            </div>\n            <div class="fish-lab-render-meta">\n              <span data-live-render-note>${initialVariant?'Source-authentic normal render':'Render unavailable'}</span>\n              <strong data-live-scale>${fmt1(specimenState.length)} cm · ${(specimenState.length/100).toFixed(2)} blocks</strong>\n            </div>\n          </div>'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''            <input id="fish-lab-percentile" data-live-percentile-input type="range" min="0" max="100" step="1" value="${specimenState.percentile}">\n            <div class="fish-lab-range-labels"><span>0th</span><span>100th</span></div>'''
          new = '''            <input id="fish-lab-percentile" data-live-percentile-input type="range" min="0" max="100" step="1" value="${specimenState.percentile}">\n            <div class="fish-lab-range-labels"><span data-live-percentile-min>0th</span><span>100th</span></div>\n            <div class="fish-lab-perfect-note" data-perfect-percentile-note hidden>Perfect Specimen requires 95th percentile or higher.</div>'''
          assert old in s
          s = s.replace(old, new, 1)

          start = s.index('function renderScaleFor(r,state){')
          end = s.index('\nfunction updateSpecimenLive(){', start)
          replacement = r'''function updatePhysicalScale(r,state){
  const stage=modal.querySelector('[data-live-render-stage]');
  const img=modal.querySelector('[data-live-render-img]');
  const scaleOut=modal.querySelector('[data-live-scale]');
  if(!stage||!img)return;

  const apply=()=>{
    const blocks=Math.max(.01,Number(state.length||0)/100);
    const naturalAspect=(img.naturalWidth>0&&img.naturalHeight>0)?img.naturalHeight/img.naturalWidth:.45;
    const usableW=Math.max(180,stage.clientWidth-70);
    const usableH=Math.max(120,stage.clientHeight-118);
    const preferredBlock=clamp(stage.clientWidth*.17,112,178);
    const fitByWidth=usableW/blocks;
    const fitByHeight=usableH/Math.max(blocks*naturalAspect,.01);
    const blockPx=Math.max(10,Math.min(preferredBlock,fitByWidth,fitByHeight));
    const fishPx=Math.max(4,blocks*blockPx);

    stage.style.setProperty('--block-px',`${blockPx}px`);
    stage.style.setProperty('--fish-width',`${fishPx}px`);
    img.style.width=`${fishPx}px`;
    img.style.height='auto';
    img.style.maxWidth='none';
    img.style.maxHeight='none';
    img.style.transform='none';

    if(scaleOut)scaleOut.textContent=`${fmt1(state.length)} cm · ${blocks.toFixed(2)} blocks`;
    stage.dataset.scaleMode=blockPx<preferredBlock*.97?'fit':'physical';
  };

  if(img.complete&&img.naturalWidth)apply();
  else img.addEventListener('load',apply,{once:true});
}
'''
          s = s[:start] + replacement + s[end:]

          old = '''  const r=openRecord,state=specimenState;\n  const breakdown=scoreBreakdown(r,state.percentile,state.condition,state.body,state.length);\n  const scale=renderScaleFor(r,state);\n  const variant=variantFor(r.id,state.condition);'''
          new = '''  const r=openRecord,state=specimenState;\n  if(state.condition==='perfect_specimen'&&state.percentile<95)state.percentile=95;\n  const pctSlider=modal.querySelector('[data-live-percentile-input]');\n  const pctMin=modal.querySelector('[data-live-percentile-min]');\n  const perfectNote=modal.querySelector('[data-perfect-percentile-note]');\n  if(pctSlider){\n    pctSlider.min=state.condition==='perfect_specimen'?95:0;\n    pctSlider.value=state.percentile;\n  }\n  if(pctMin)pctMin.textContent=state.condition==='perfect_specimen'?'95th':'0th';\n  if(perfectNote)perfectNote.hidden=state.condition!=='perfect_specimen';\n  const breakdown=scoreBreakdown(r,state.percentile,state.condition,state.body,state.length);\n  const variant=variantFor(r.id,state.condition);'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''  const scaleOut=modal.querySelector('[data-live-scale]');\n  if(scaleOut)scaleOut.textContent=`${scale.toFixed(2)}× display scale`;\n\n  const img=modal.querySelector('[data-live-render-img]');'''
          new = '''  const img=modal.querySelector('[data-live-render-img]');'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    img.style.setProperty('--specimen-scale',String(scale));\n    img.style.transform=`scale(${scale})`;'''
          assert old in s
          s = s.replace(old, '''    updatePhysicalScale(r,state);''', 1)

          old = '''  modal.querySelectorAll('[data-body]').forEach(btn=>btn.classList.toggle('active',btn.dataset.body===state.body));\n}'''
          new = '''  modal.querySelectorAll('[data-body]').forEach(btn=>btn.classList.toggle('active',btn.dataset.body===state.body));\n  updatePhysicalScale(r,state);\n}'''
          assert old in s
          s = s.replace(old, new, 1)

          old = "if(e.target.matches('[data-live-percentile-input]')){specimenState.percentile=Number(e.target.value);updateSpecimenLive();return}"
          new = "if(e.target.matches('[data-live-percentile-input]')){specimenState.percentile=specimenState.condition==='perfect_specimen'?Math.max(95,Number(e.target.value)):Number(e.target.value);updateSpecimenLive();return}"
          assert old in s
          s = s.replace(old, new, 1)

          js_path.write_text(s)

          css_path = Path('assets/fish-specimen-lab.css')
          css = css_path.read_text()
          css += r'''

/* Physical specimen scale: 1 Minecraft block = 100 cm. */
.fish-lab-render-stage{
  --block-px:150px;
  --fish-width:150px;
  background:
    linear-gradient(rgba(39,104,116,.055) 1px,transparent 1px),
    linear-gradient(90deg,rgba(39,104,116,.055) 1px,transparent 1px),
    radial-gradient(circle at 50% 42%,rgba(53,139,148,.17),transparent 58%),
    linear-gradient(180deg,#081c2a,#071520);
  background-size:32px 32px,32px 32px,auto,auto;
}
.fish-lab-depth-grid{
  position:absolute;inset:0;pointer-events:none;opacity:.52;
  background:linear-gradient(to bottom,transparent 74%,rgba(50,179,177,.045));
}
.fish-lab-render-shell{
  inset:10% 4% 22%;
  overflow:visible;
  display:flex;
  align-items:center;
  justify-content:center;
}
.fish-lab-render-shell img{
  width:var(--fish-width)!important;
  height:auto!important;
  max-width:none!important;
  max-height:none!important;
  object-fit:contain;
  transform:none!important;
  transform-origin:center;
  filter:drop-shadow(0 12px 18px rgba(0,0,0,.22));
  transition:width 220ms cubic-bezier(.2,.8,.2,1),filter 180ms ease!important;
}
.fish-lab-scale-reference{
  position:absolute;left:14px;bottom:31px;z-index:4;
  display:flex;align-items:flex-end;gap:8px;pointer-events:none;
  color:#9edbd8;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}
.fish-lab-block-icon{
  width:25px;height:25px;flex:0 0 25px;border:1px solid #4d8c86;
  box-shadow:inset 0 0 0 2px rgba(4,18,25,.55),0 3px 8px rgba(0,0,0,.2);
  background:
    linear-gradient(90deg,transparent 48%,rgba(7,42,44,.34) 48% 53%,transparent 53%),
    linear-gradient(transparent 48%,rgba(7,42,44,.34) 48% 53%,transparent 53%),
    linear-gradient(135deg,#5d9489 0 25%,#39766f 25% 50%,#528b80 50% 75%,#316b68 75%);
  background-size:8px 8px,8px 8px,100% 100%;
  image-rendering:pixelated;
}
.fish-lab-ruler{width:var(--block-px);min-width:10px;transition:width 220ms cubic-bezier(.2,.8,.2,1)}
.fish-lab-ruler-ticks{
  display:block;height:12px;border-bottom:2px solid #59d5cd;
  background:repeating-linear-gradient(90deg,#59d5cd 0 1px,transparent 1px 10%);
  opacity:.8;
}
.fish-lab-ruler>div{display:flex;justify-content:space-between;gap:8px;margin-top:4px;white-space:nowrap}
.fish-lab-ruler strong{color:#d9fbf7;font-size:7px;letter-spacing:.08em}
.fish-lab-ruler em{color:#6fa6aa;font-size:7px;font-style:normal}
.fish-lab-render-stage[data-scale-mode="fit"] .fish-lab-ruler strong::after{content:" · AUTO-FIT";color:#d8bd67}
.fish-lab-perfect-note{
  margin-top:2px;padding:6px 8px;border:1px solid rgba(226,202,95,.3);border-radius:7px;
  background:rgba(116,94,24,.12);color:#e8da91;font:700 7px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.04em;text-transform:uppercase;
}
.fish-lab-perfect-note[hidden]{display:none!important}
@media(max-width:780px){
  .fish-lab-scale-reference{left:10px;bottom:30px}
  .fish-lab-block-icon{width:21px;height:21px;flex-basis:21px}
}
'''
          css_path.write_text(css)

          index = Path('fish/index.html')
          html = index.read_text()
          html = html.replace('fish-specimen-lab.css?v=1','fish-specimen-lab.css?v=2')
          html = html.replace('fish-specimen-lab.js?v=1','fish-specimen-lab.js?v=2')
          index.write_text(html)
          PY
      - name: Commit calibrated specimen lab
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/fish-specimen-lab.js assets/fish-specimen-lab.css fish/index.html
          git commit -m 'Calibrate fish specimen lab to block scale'
          git push origin HEAD:dev

# trigger
