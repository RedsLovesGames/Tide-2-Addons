name: QA Fish Wiki Browser

on:
  push:
    branches:
      - dev
    paths:
      - fish/**
      - assets/**
      - scripts/qa-fish-wiki.mjs
      - scripts/qa-fish-runtime-architecture.mjs
      - package.json
      - .github/workflows/qa-fish-wiki-browser.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fish-browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned browser QA dependency
        run: npm install --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Serve GitHub Pages-style path
        shell: bash
        run: |
          set -euo pipefail
          cd ..
          python3 -m http.server 8000 > /tmp/tideborne-http.log 2>&1 &
          echo $! > /tmp/tideborne-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/Tide-2-Addons/fish/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/tideborne-http.log
          exit 1

      - name: Run browser and architecture QA
        env:
          QA_BASE_URL: http://127.0.0.1:8000/Tide-2-Addons
          QA_OUT: qa-artifacts
        run: npm run qa:fish

      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fish-wiki-browser-qa
          path: qa-artifacts/
          if-no-files-found: ignore
          retention-days: 14
