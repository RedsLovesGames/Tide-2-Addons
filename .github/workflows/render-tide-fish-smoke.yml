name: Render Tide fish runtime smoke

on:
  push:
    branches: [fish-render-source-import]
    paths:
      - '.github/workflows/render-tide-fish-smoke.yml'
      - 'tools/fish-render-export/TideFishRenderExporter/build.gradle'
      - 'tools/fish-render-export/TideFishRenderExporter/src/main/java/**'
      - 'tools/fish-render-export/TideFishRenderExporter/src/main/resources/**'
      - 'fish/render-data/registry/supported-fish-registry.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-tide:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tools/fish-render-export/TideFishRenderExporter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-read-only: false

      - name: Build exporter
        run: gradle --no-daemon build

      - name: Generate disposable 1.21.1 world
        run: |
          set -euo pipefail
          rm -rf run/server run/client
          mkdir -p run/server
          printf 'eula=true\n' > run/server/eula.txt
          cat > run/server/server.properties <<'EOF'
          online-mode=false
          level-name=world
          spawn-protection=0
          view-distance=2
          simulation-distance=2
          max-tick-time=-1
          EOF
          set +e
          timeout --signal=INT --kill-after=15s 60s gradle --no-daemon runServer
          server_status=$?
          set -e
          if [ "$server_status" -ne 0 ] && [ "$server_status" -ne 124 ] && [ "$server_status" -ne 130 ]; then
            echo "Dedicated server exited unexpectedly with $server_status"
            exit "$server_status"
          fi
          test -f run/server/world/level.dat
          mkdir -p run/client/saves
          cp -a run/server/world run/client/saves/RenderWorld
          test -f run/client/saves/RenderWorld/level.dat
          echo '--- RenderWorld save layout ---'
          find run/client/saves/RenderWorld -maxdepth 2 -type f -printf '%P\n' | sort | head -80

      - name: Run source-authentic Tide renderer under Xvfb
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          set +e
          timeout --signal=INT --kill-after=20s 10m xvfb-run -a gradle --no-daemon runRenderClient
          client_status=$?
          set -e
          if [ -f run/client/logs/latest.log ]; then
            echo '--- fish render lifecycle markers ---'
            grep -E 'FISHRENDER_(AUTO_|ENTITY)' run/client/logs/latest.log || true
            echo '--- last 120 Minecraft client log lines ---'
            tail -n 120 run/client/logs/latest.log || true
          fi
          if [ "$client_status" -ne 0 ] && [ "$client_status" -ne 124 ] && [ "$client_status" -ne 130 ]; then
            echo "Render client exited unexpectedly with $client_status"
            exit "$client_status"
          fi

      - name: Validate Tide runtime render contract
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          root = Path('run/client/fishrender-output')
          status_path = root / 'generated/auto-export-status.json'
          report_path = root / 'generated/render-report.json'
          assert status_path.exists(), f'missing {status_path}'
          assert report_path.exists(), f'missing {report_path}'
          status = json.loads(status_path.read_text())
          report = json.loads(report_path.read_text())
          pngs = sorted((root / 'fish/assets/renders').glob('*.png'))
          assert status['status'] == 'success', status
          assert status['mode'] == 'tide:tuna', status
          assert status['total_fish'] == 1, status
          assert status['successful'] == 1, status
          assert status['failed'] == 0, status
          assert report['failed'] == 0, report.get('exceptions')
          assert report['mode'] == 'export:tide:tuna:default', report
          assert len(report['successes']) == 1, report['successes']
          success = report['successes'][0]
          assert success['fish_id'] == 'tide:tuna', success
          assert success['entity_id'].startswith('tide:'), success
          assert success['source_mod'], success
          assert [png.name for png in pngs] == ['tide__tuna.png'], pngs
          data = pngs[0].read_bytes()
          assert len(data) > 256, (pngs[0], len(data))
          assert data.startswith(b'\x89PNG\r\n\x1a\n'), pngs[0]
          with Image.open(pngs[0]) as image:
              assert image.mode == 'RGBA', image.mode
              alpha = image.getchannel('A')
              assert alpha.getextrema() == (0, 255), alpha.getextrema()
              bounds = alpha.getbbox()
              assert bounds is not None, 'render has no non-transparent pixels'
              left, top, right, bottom = bounds
              assert left > 0 and top > 0 and right < image.width and bottom < image.height, (image.size, bounds)
              width, height = right - left, bottom - top
              assert width > height, f'tuna is not framed in side profile: {width}x{height}'
              opaque_colors = [rgba[:3] for rgba in image.getdata() if rgba[3] > 0]
              assert any(rgb != (0, 0, 0) for rgb in opaque_colors), 'render contains only black pixels'
          print(f'RUNTIME_RENDER_VALID fish=tide:tuna png={pngs[0]} alpha_bounds={bounds} report={report_path}')
          PY

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tide-fish-runtime-renders
          path: |
            tools/fish-render-export/TideFishRenderExporter/run/client/fishrender-output/
            tools/fish-render-export/TideFishRenderExporter/run/client/logs/
          if-no-files-found: warn
          retention-days: 14

