name: Legacy Hybrid Aquatic geometry projector

# Historical fallback only. Do not use this workflow for published Fish Wiki renders.
# Hybrid Aquatic production/dev renders are generated by the actual Minecraft
# EntityRenderDispatcher workflow in render-hybrid-aquatic-runtime-dev.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-render-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Explain legacy status
        run: |
          echo 'This workflow is retained only for comparison/debugging.'
          echo 'It does not publish or commit renders.'
          echo 'Use render-hybrid-aquatic-runtime-dev.yml for source-authentic Hybrid Aquatic renders.'
