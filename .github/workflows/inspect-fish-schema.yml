name: Inspect Fish Data Schema

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/inspect-fish-schema.yml
      - scripts/build-fish-wiki.py
      - tools/fish-render-source/source-manifest.json
      - tools/fish-render-source/download_sources.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download and extract pinned FishData sources
        run: |
          set -euo pipefail
          rm -rf /tmp/fish-schema-src
          mkdir -p /tmp/fish-schema-src/mods /tmp/fish-schema-src/tide /tmp/fish-schema-src/extra
          python tools/fish-render-source/download_sources.py \
            --id tide \
            --id tide_extra_compatibility \
            --out /tmp/fish-schema-src/mods \
            --resolved-manifest /tmp/fish-schema-src/resolved.json
          python - <<'PY'
          import json, pathlib, zipfile
          root = pathlib.Path('/tmp/fish-schema-src')
          resolved = json.loads((root / 'resolved.json').read_text())
          by_id = {row['id']: row for row in resolved['sources']}
          for source_id, dest in [('tide', 'tide'), ('tide_extra_compatibility', 'extra')]:
              with zipfile.ZipFile(root / 'mods' / by_id[source_id]['filename']) as z:
                  z.extractall(root / dest)
          PY

      - name: Inspect schemas
        shell: python
        run: |
          import json, pathlib, collections
          out=[]
          roots=[('extra',pathlib.Path('/tmp/fish-schema-src/extra')),('tide',pathlib.Path('/tmp/fish-schema-src/tide'))]
          for label,root in roots:
              files=[p for p in root.rglob('*.json') if '/fishing/fish/' in p.as_posix()]
              out += [f'## {label}: {len(files)} fish files']
              schemas=collections.Counter()
              for p in files:
                  try: data=json.loads(p.read_text())
                  except Exception: continue
                  schemas[tuple(sorted(data))]+=1
              for keys,n in schemas.most_common(): out.append(f'{n} x keys={list(keys)}')
              out.append('')
              for p in sorted(files)[:3]:
                  out += [f'### {p.relative_to(root)}', json.dumps(json.loads(p.read_text()),indent=2,sort_keys=True), '']

          for root in [pathlib.Path('/tmp/fish-schema-src/tide'), pathlib.Path('/tmp/fish-schema-src/extra')]:
              samples=[p for p in root.rglob('*.json') if '/fishing/fish/' in p.as_posix() and p.stem in {'tuna','trout','lavacanth'}]
              for p in sorted(samples)[:8]:
                  out += [f'### SAMPLE {p}', json.dumps(json.loads(p.read_text()),indent=2,sort_keys=True), '']

          candidates=[p for p in pathlib.Path('/tmp/fish-schema-src/tide').rglob('*.json') if '/fishing/' in p.as_posix() and ('profile' in p.as_posix() or 'profiles' in p.as_posix())]
          out += [f'## Profile candidates: {len(candidates)}']
          for p in sorted(candidates)[:30]:
              out += [str(p), json.dumps(json.loads(p.read_text()),indent=2,sort_keys=True)]

          pathlib.Path('fish-schema-report.txt').write_text('\n'.join(out) + '\n')

      - name: Upload schema report
        uses: actions/upload-artifact@v4
        with:
          name: fish-schema-report
          path: |
            fish-schema-report.txt
            /tmp/fish-schema-src/resolved.json
          if-no-files-found: error
          retention-days: 30
