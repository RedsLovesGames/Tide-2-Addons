name: Diagnose render source downloads

on:
  push:
    branches:
      - fish-render-source-import
    paths:
      - tools/fish-render-source/import-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Luminous 1.5.52 NeoForge source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, urllib.parse, urllib.request
          expected='05f6244a25081abe5071394f2ff5d67d0053c2a7904931b191f81ba865905a6b'
          filename='Luminous Overworld V1.5.52 -NeoForge 1.21.1.jar'
          url='https://cdn.modrinth.com/data/HT2F6lNL/versions/7gCLLt7C/'+urllib.parse.quote(filename)
          req=urllib.request.Request(url,headers={'User-Agent':'TideborneFishWikiSourceImporter/1.0'})
          data=urllib.request.urlopen(req,timeout=60).read()
          got=hashlib.sha256(data).hexdigest()
          print('LUMINOUS',len(data),url,got)
          if got != expected:
              raise SystemExit(f'Luminous source hash mismatch: {got}')
          print('Exact Luminous source verified.')
          PY
