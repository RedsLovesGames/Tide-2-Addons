name: Diagnose render source downloads

on:
  push:
    branches:
      - fish-render-source-import
    paths:
      - tools/fish-render-source/import-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query exact Modrinth versions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request
          headers={'User-Agent':'TideborneFishWikiSourceImporter/1.0'}
          for version_id in ['l3UnUslY','jivgObmp','ztNu3GtG']:
              req=urllib.request.Request(f'https://api.modrinth.com/v2/version/{version_id}',headers=headers)
              try:
                  v=json.load(urllib.request.urlopen(req,timeout=30))
                  print('VERSION',version_id,'=>',json.dumps({'project_id':v.get('project_id'),'version_number':v.get('version_number'),'game_versions':v.get('game_versions'),'loaders':v.get('loaders'),'files':v.get('files',[])}))
              except Exception as e:
                  print('VERSION_ERROR',version_id,type(e).__name__,str(e))
          PY
