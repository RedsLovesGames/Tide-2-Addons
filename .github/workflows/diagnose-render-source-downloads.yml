name: Diagnose render source downloads

on:
  push:
    branches:
      - fish-render-source-import
    paths:
      - tools/fish-render-source/import-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Youkai 3.0.8 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, urllib.request
          expected='1364a94d5ff4cce18284c8a824626623a629b62056eb557aaf89779f6f4da752'
          url='https://cdn.modrinth.com/data/uJT3ahxz/versions/vu5Xy9Dk/youkaishomecoming-3.0.8.jar'
          req=urllib.request.Request(url,headers={'User-Agent':'TideborneFishWikiSourceImporter/1.0'})
          data=urllib.request.urlopen(req,timeout=60).read()
          got=hashlib.sha256(data).hexdigest()
          print('YOUKAI',len(data),url,got)
          if got != expected:
              raise SystemExit(f'Youkai source hash mismatch: {got}')
          print('Exact Youkai source verified.')
          PY
      - name: Inspect staged source bundle payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, io, json, pathlib, tarfile, zipfile
          root=pathlib.Path('tools/fish-render-source/import-payload')
          chunks=sorted(root.glob('meta-*.b64'))
          encoded=''.join(p.read_text().strip() for p in chunks)
          raw=base64.b64decode(encoded)
          data=gzip.decompress(raw) if raw[:2]==b'\x1f\x8b' else raw
          print('PAYLOAD_CHUNKS',len(chunks),'ENCODED',len(encoded),'RAW',len(raw),'DATA',len(data))
          print('MAGIC',repr(data[:32]))
          try:
              obj=json.loads(data.decode())
          except Exception as exc:
              print('JSON_ERROR',type(exc).__name__,str(exc))
          else:
              print('JSON_TYPE',type(obj).__name__)
              if isinstance(obj,dict):
                  print('JSON_KEYS',sorted(obj))
                  for k,v in obj.items():
                      if isinstance(v,list): print('KEY',k,'LIST_LEN',len(v),'SAMPLE',repr(v[:2])[:5000])
                      elif isinstance(v,dict): print('KEY',k,'DICT_LEN',len(v),'SUBKEYS',list(v)[:40])
                      else: print('KEY',k,repr(v)[:2000])
              raise SystemExit(0)
          bio=io.BytesIO(data)
          try:
              with tarfile.open(fileobj=bio,mode='r:*') as tf:
                  names=tf.getnames();print('TAR_ENTRIES',len(names));print('\n'.join(names[:150]));raise SystemExit(0)
          except tarfile.ReadError: pass
          bio.seek(0)
          try:
              with zipfile.ZipFile(bio) as zf:
                  names=zf.namelist();print('ZIP_ENTRIES',len(names));print('\n'.join(names[:150]));raise SystemExit(0)
          except zipfile.BadZipFile: pass
          print('TEXT_SAMPLE',data[:12000].decode(errors='replace'))
          PY
