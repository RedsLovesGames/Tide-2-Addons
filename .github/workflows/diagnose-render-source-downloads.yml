name: Diagnose render source downloads

on:
  push:
    branches:
      - fish-render-source-import
    paths:
      - tools/fish-render-source/import-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve exact CurseForge file IDs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html as htmlmod, re, urllib.request
          rows = [
            ('aquaculture','Aquaculture-1.21.1-2.7.21.jar'),
            ('betterend-neoforge','BetterEnd-21.0.19-fabric.jar'),
            ('lendercataclysm',"L_Ender's Cataclysm 1.21.1-3.33.jar"),
            ('luminous-overworld','Luminous Overworld V1.5.52 -NeoForge 1.21.1.jar'),
            ('the-undergarden','The_Undergarden-1.21.1-0.9.6.jar'),
            ('aquamirae-fabric','aquamirae-fabric-1.21.1-7.2.3.jar'),
            ('clutterbestiary','clutterbestiary-1.1.2-fabric-1.21.1.jar'),
            ('crabbers-delight','crabbersdelight-1.21.1-1.2.6.jar'),
            ('critters-and-companions','crittersandcompanions-fabric-1.21.1-2.7.0.jar'),
            ('deep-aether','deep_aether-1.21.1-1.1.5.1.jar'),
            ('environmental','environmental-1.21.1-5.0.1.jar'),
            ('fish-of-thieves','fish_of_thieves-mc1.21.1-v21.1.2.1-fabric.jar'),
            ('nether-depths-upgrade','netherdepthsupgrade-fabric-3.2+1.21.1.jar'),
            ('spawn-mod','spawn-4.0.7-1.21.1.jar'),
            ('tide','tide-fabric-1.21.1-2.1.1.jar'),
            ('upgrade-aquatic','upgrade_aquatic-1.21.1-7.0.1.jar'),
            ('wans-ancient-beasts','wab-1.21.1-1.3.2.jar'),
            ('youkai-homecoming','youkaishomecoming-3.0.8.jar'),
          ]
          headers={'User-Agent':'Mozilla/5.0 TideborneFishWikiSourceImporter/1.0'}
          for slug, filename in rows:
              urls=[
                f'https://www.curseforge.com/minecraft/mc-mods/{slug}/files/all?page=1&pageSize=50&version=1.21.1',
                f'https://www.curseforge.com/minecraft/mc-mods/{slug}/files/all?page=1&pageSize=50',
              ]
              resolved=None
              for url in urls:
                  try:
                      req=urllib.request.Request(url,headers=headers)
                      raw=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','ignore')
                  except Exception as e:
                      print('FETCH_ERROR',slug,type(e).__name__,str(e)); continue
                  text=htmlmod.unescape(raw)
                  pos=text.find(filename)
                  if pos<0:
                      pos=text.lower().find(filename.lower())
                  if pos>=0:
                      window=text[max(0,pos-10000):min(len(text),pos+10000)]
                      ids=re.findall(rf'/minecraft/mc-mods/{re.escape(slug)}/files/(\d+)',window)
                      if ids:
                          resolved=ids[-1] if len(set(ids))==1 else ids[0]
                          break
              print('CURSEFORGE',slug,filename,'=>',resolved or 'NOT_FOUND')
          PY
