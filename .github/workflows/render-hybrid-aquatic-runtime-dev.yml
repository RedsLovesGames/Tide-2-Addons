name: Render Hybrid Aquatic with Minecraft renderer

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/render-hybrid-aquatic-runtime-dev.yml'
      - 'tools/fish-render-export/TideFishRenderExporter/build.gradle'
      - 'tools/fish-render-export/TideFishRenderExporter/src/main/java/**'
      - 'tools/fish-render-export/TideFishRenderExporter/src/main/resources/**'
      - 'fish/render-data/registry/supported-fish-registry.json'
      - 'fish/render-data/modpack-scope.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-hybrid:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tools/fish-render-export/TideFishRenderExporter
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-read-only: false

      - name: Verify pinned Hybrid Aquatic renderer dependency
        run: |
          set -euo pipefail
          gradle --no-daemon verifyHybridAquaticPin
          grep -Fq "hybridAquaticVersion = '1.5.5'" build.gradle
          grep -Fq "hybridAquaticModrinthVersion = '6EfLaKkB'" build.gradle
          echo 'HYBRID_DEPENDENCY_GUARD_OK version=1.5.5 modrinth=6EfLaKkB'

      - name: Build actual client renderer exporter
        run: gradle --no-daemon build

      - name: Generate disposable 1.21.1 world without Hybrid Aquatic
        run: |
          set -euo pipefail
          rm -rf run/server run/client
          mkdir -p run/server
          printf 'eula=true\n' > run/server/eula.txt
          cat > run/server/server.properties <<'EOF'
          online-mode=false
          level-name=world
          spawn-protection=0
          view-distance=2
          simulation-distance=2
          max-tick-time=-1
          EOF
          set +e
          timeout --signal=INT --kill-after=15s 75s gradle -PskipHybridAquatic=true --no-daemon runServer
          server_status=$?
          set -e
          if [ "$server_status" -ne 0 ] && [ "$server_status" -ne 124 ] && [ "$server_status" -ne 130 ]; then
            echo "Minimal world-generation server exited unexpectedly with $server_status"
            exit "$server_status"
          fi
          test -f run/server/world/level.dat
          mkdir -p run/client/saves
          cp -a run/server/world run/client/saves/RenderWorld
          test -f run/client/saves/RenderWorld/level.dat
          echo 'HYBRID_RENDER_WORLD_READY source=minimal_server hybrid_aquatic_loaded=false'

      - name: Install headless render dependencies
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          python -m pip install --disable-pip-version-check pillow

      - name: Smoke render Oarfish through EntityRenderDispatcher
        run: |
          set -euo pipefail
          rm -rf run/client/fishrender-output
          set +e
          timeout --signal=INT --kill-after=20s 12m xvfb-run -a gradle --no-daemon runRenderHybridOarfish
          client_status=$?
          set -e
          if [ -f run/client/logs/latest.log ]; then
            echo '--- Oarfish smoke renderer markers ---'
            grep -E 'FISHRENDER_(AUTO_|ENTITY_DIRECT)' run/client/logs/latest.log || true
            echo '--- Hybrid Aquatic runtime version ---'
            grep -E -- '- hybrid[-_]aquatic 1\.5\.5' run/client/logs/latest.log || true
            echo '--- last 160 client log lines ---'
            tail -n 160 run/client/logs/latest.log || true
          fi
          if [ "$client_status" -ne 0 ] && [ "$client_status" -ne 124 ] && [ "$client_status" -ne 130 ]; then
            echo "Oarfish render client exited unexpectedly with $client_status"
            exit "$client_status"
          fi
          grep -Eq -- '- hybrid[-_]aquatic 1\.5\.5' run/client/logs/latest.log
          grep -q 'FISHRENDER_ENTITY_DIRECT fish=hybrid_aquatic:oarfish' run/client/logs/latest.log
          grep -q 'renderer=' run/client/logs/latest.log

      - name: Validate Oarfish smoke render
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          root = Path('run/client/fishrender-output')
          status = json.loads((root / 'generated/auto-export-status.json').read_text())
          report = json.loads((root / 'generated/render-report.json').read_text())
          assert status['status'] == 'success', status
          assert status['mode'] == 'hybrid_aquatic:oarfish', status
          assert status['total_fish'] == 1, status
          assert status['successful'] == 1, status
          assert status['failed'] == 0, status
          assert report['successful'] == 1 and report['failed'] == 0, report
          row = report['successes'][0]
          assert row['fish_id'] == 'hybrid_aquatic:oarfish', row
          assert row['render_mode'] == 'minecraft_entity_dispatcher', row
          assert row['resolved_entity_id'] in ('hybrid_aquatic:oarfish', 'hybrid-aquatic:oarfish'), row
          png = root / 'fish/assets/renders/hybrid_aquatic__oarfish.png'
          assert png.is_file(), png
          with Image.open(png) as im:
              assert im.mode == 'RGBA', im.mode
              bounds = im.getchannel('A').getbbox()
              assert bounds is not None, 'blank Oarfish render'
              l,t,r,b = bounds
              width, height = r-l, b-t
              assert l > 0 and t > 0 and r < im.width and b < im.height, (im.size, bounds)
              assert width >= 40 and height >= 4, (im.size, bounds)
              assert width / max(height, 1) >= 2.0, ('Oarfish does not read as a side-on elongated fish', im.size, bounds)
          print('HYBRID_OARFISH_SMOKE_OK actual_entity_dispatcher=1')
          PY
          mkdir -p /tmp/hybrid-smoke
          cp run/client/fishrender-output/fish/assets/renders/hybrid_aquatic__oarfish.png /tmp/hybrid-smoke/
          cp run/client/fishrender-output/generated/render-report.json /tmp/hybrid-smoke/oarfish-render-report.json

      - name: Render all Hybrid Aquatic fish through EntityRenderDispatcher
        run: |
          set -euo pipefail
          rm -rf run/client/fishrender-output
          set +e
          timeout --signal=INT --kill-after=20s 22m xvfb-run -a gradle --no-daemon runRenderHybrid
          client_status=$?
          set -e
          if [ -f run/client/logs/latest.log ]; then
            echo '--- actual entity renderer markers ---'
            grep -E 'FISHRENDER_(AUTO_|ENTITY_DIRECT)' run/client/logs/latest.log || true
            echo '--- Hybrid Aquatic runtime version ---'
            grep -E -- '- hybrid[-_]aquatic 1\.5\.5' run/client/logs/latest.log || true
            echo '--- last 180 client log lines ---'
            tail -n 180 run/client/logs/latest.log || true
          fi
          if [ "$client_status" -ne 0 ] && [ "$client_status" -ne 124 ] && [ "$client_status" -ne 130 ]; then
            echo "Render client exited unexpectedly with $client_status"
            exit "$client_status"
          fi
          grep -Eq -- '- hybrid[-_]aquatic 1\.5\.5' run/client/logs/latest.log

      - name: Validate 49 actual Hybrid Aquatic renders
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          root = Path('run/client/fishrender-output')
          status = json.loads((root / 'generated/auto-export-status.json').read_text())
          report = json.loads((root / 'generated/render-report.json').read_text())
          assert status['status'] == 'success', status
          assert status['mode'] == 'namespace:hybrid_aquatic', status
          assert status['total_fish'] == 49, status
          assert status['successful'] == 49, status
          assert status['failed'] == 0, status
          assert report['mode'] == 'export:hybrid_aquatic:default', report
          assert report['total_fish'] == 49, report
          assert report['successful'] == 49, report.get('exceptions')
          assert report['failed'] == 0, report.get('exceptions')
          rows = report['successes']
          assert len(rows) == 49, len(rows)
          assert all(r.get('render_mode') == 'minecraft_entity_dispatcher' for r in rows), {r.get('render_mode') for r in rows}
          for row in rows:
              fish_id = str(row.get('fish_id',''))
              resolved = str(row.get('resolved_entity_id',''))
              assert fish_id.startswith('hybrid_aquatic:'), row
              allowed = {fish_id, fish_id.replace('hybrid_aquatic:', 'hybrid-aquatic:', 1)}
              assert resolved in allowed, (fish_id, resolved)

          renders = root / 'fish/assets/renders'
          pngs = sorted(renders.glob('hybrid_aquatic__*.png'))
          assert len(pngs) == 49, len(pngs)
          for png in pngs:
              with Image.open(png) as im:
                  assert im.mode == 'RGBA', (png.name, im.mode)
                  bounds = im.getchannel('A').getbbox()
                  assert bounds is not None, png.name
                  l,t,r,b = bounds
                  assert l > 0 and t > 0 and r < im.width and b < im.height, (png.name, im.size, bounds)
                  assert (r-l) >= 3 and (b-t) >= 3, (png.name, bounds)
          oarfish = renders / 'hybrid_aquatic__oarfish.png'
          with Image.open(oarfish) as im:
              l,t,r,b = im.getchannel('A').getbbox()
              assert (r-l) / max((b-t), 1) >= 2.0, ('full-batch Oarfish aspect regression', im.size, (l,t,r,b))
          print('HYBRID_RUNTIME_VALID total=49 actual_entity_dispatcher=49 version=1.5.5')
          PY

      - name: Publish only validated Hybrid Aquatic runtime renders
        run: |
          set -euo pipefail
          cd ../../..
          out='tools/fish-render-export/TideFishRenderExporter/run/client/fishrender-output'
          mkdir -p /tmp/hybrid-renders
          cp "$out"/fish/assets/renders/hybrid_aquatic__*.png /tmp/hybrid-renders/
          cp "$out"/generated/render-report.json /tmp/hybrid-render-report.json

          git fetch origin dev
          git reset --hard origin/dev
          cp /tmp/hybrid-renders/hybrid_aquatic__*.png fish/assets/renders/
          cp /tmp/hybrid-render-report.json /tmp/render-report.json

          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          report = json.loads(Path('/tmp/render-report.json').read_text())
          manifest_path = root / 'assets/fish-render-manifest.json'
          manifest = json.loads(manifest_path.read_text())
          fish = manifest.setdefault('fish', {})
          for row in report['successes']:
              fish_id = row['fish_id']
              ns, path = fish_id.split(':', 1)
              filename = ns + '__' + path.replace('/', '_').replace(':', '_') + '.png'
              fish[fish_id] = {
                  'source': 'Hybrid Aquatic 1.5.5 actual Minecraft EntityRenderDispatcher',
                  'entity': row.get('resolved_entity_id') or row.get('entity_id'),
                  'renderer_mode': row.get('render_mode'),
                  'source_mod_version': '1.5.5',
                  'source_modrinth_version_id': '6EfLaKkB',
                  'variants': {
                      'normal': {
                          'file': f'fish/assets/renders/{filename}',
                          'status': 'source_backed_runtime_entity'
                      }
                  }
              }
          manifest['generatedBy'] = 'Tide Fish Render Exporter + Minecraft EntityRenderDispatcher'
          manifest['pipelineStatus'] = 'source_authentic_partial_runtime'
          manifest['policy'] = 'Published fish images are source-backed runtime renders. Hybrid Aquatic entries use Hybrid Aquatic 1.5.5 and the actual Minecraft client EntityRenderDispatcher, never the legacy custom geometry projector.'
          counts = manifest.setdefault('counts', {})
          counts['supported_fish'] = len(fish)
          counts['normal'] = sum(1 for v in fish.values() if v.get('variants',{}).get('normal',{}).get('file'))
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fish/assets/renders/hybrid_aquatic__*.png assets/fish-render-manifest.json
          if git diff --cached --quiet; then
            echo 'No Hybrid Aquatic render changes to publish.'
          else
            git commit -m 'Publish validated Hybrid Aquatic 1.5.5 entity renders'
            git push origin HEAD:dev
          fi

      - name: Upload Hybrid Aquatic runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-aquatic-runtime-renders
          path: |
            tools/fish-render-export/TideFishRenderExporter/run/client/fishrender-output/
            tools/fish-render-export/TideFishRenderExporter/run/client/logs/
            /tmp/hybrid-smoke/
          if-no-files-found: warn
          retention-days: 14
