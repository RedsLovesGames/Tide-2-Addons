name: Render Hybrid Aquatic baseline with Minecraft renderer

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/render-hybrid-aquatic-runtime-dev.yml'
      - 'tools/fish-render-export/TideFishRenderExporter/build.gradle'
      - 'tools/fish-render-export/TideFishRenderExporter/src/main/java/**'
      - 'tools/fish-render-export/TideFishRenderExporter/src/main/resources/**'
      - 'fish/render-data/registry/supported-fish-registry.json'
      - 'fish/render-data/modpack-scope.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hybrid-aquatic-baseline-render
  cancel-in-progress: true

jobs:
  render-hybrid:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tools/fish-render-export/TideFishRenderExporter
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-read-only: false

      - name: Verify committed baseline profile
        run: |
          set -euo pipefail
          gradle --no-daemon verifyHybridAquaticPin
          echo 'HYBRID_BASELINE_PROFILE version=1.5.5 namespace_mode=hyphenated dispatcher_yaw=0 matrix_y=90'

      - name: Build actual client renderer exporter
        run: gradle --no-daemon build

      - name: Generate disposable 1.21.1 world without Hybrid Aquatic
        run: |
          set -euo pipefail
          rm -rf run/server run/client
          mkdir -p run/server
          printf 'eula=true\n' > run/server/eula.txt
          cat > run/server/server.properties <<'EOF'
          online-mode=false
          level-name=world
          spawn-protection=0
          view-distance=2
          simulation-distance=2
          max-tick-time=-1
          EOF
          set +e
          timeout --signal=INT --kill-after=15s 75s gradle -PskipHybridAquatic=true --no-daemon runServer
          server_status=$?
          set -e
          if [ "$server_status" -ne 0 ] && [ "$server_status" -ne 124 ] && [ "$server_status" -ne 130 ]; then
            echo "Minimal world-generation server exited unexpectedly with $server_status"
            exit "$server_status"
          fi
          test -f run/server/world/level.dat
          mkdir -p run/client/saves
          cp -a run/server/world run/client/saves/RenderWorld
          test -f run/client/saves/RenderWorld/level.dat

      - name: Install headless render dependencies
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          python -m pip install --disable-pip-version-check pillow

      - name: Smoke render Oarfish through EntityRenderDispatcher
        run: |
          set -euo pipefail
          rm -rf run/client/fishrender-output
          set +e
          timeout --signal=INT --kill-after=20s 12m xvfb-run -a gradle --no-daemon runRenderHybridOarfish
          client_status=$?
          set -e
          if [ -f run/client/logs/latest.log ]; then
            grep -E 'FISHRENDER_(AUTO_|ENTITY_DIRECT)' run/client/logs/latest.log || true
            tail -n 140 run/client/logs/latest.log || true
          fi
          if [ "$client_status" -ne 0 ] && [ "$client_status" -ne 124 ] && [ "$client_status" -ne 130 ]; then
            exit "$client_status"
          fi
          grep -Eq -- '- hybrid[-_]aquatic 1\.5\.5' run/client/logs/latest.log
          grep -q 'FISHRENDER_ENTITY_DIRECT fish=hybrid_aquatic:oarfish' run/client/logs/latest.log
          grep -q 'projection=ortho yaw=0.0 matrix_y=90.0' run/client/logs/latest.log

      - name: Validate Oarfish smoke render
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          root = Path('run/client/fishrender-output')
          status = json.loads((root / 'generated/auto-export-status.json').read_text())
          report = json.loads((root / 'generated/render-report.json').read_text())
          assert status['status'] == 'success' and status['mode'] == 'hybrid_aquatic:oarfish', status
          assert status['total_fish'] == 1 and status['successful'] == 1 and status['failed'] == 0, status
          row = report['successes'][0]
          assert row['render_mode'] == 'minecraft_entity_dispatcher', row
          png = root / 'fish/assets/renders/hybrid_aquatic__oarfish.png'
          with Image.open(png) as im:
              bounds = im.getchannel('A').getbbox()
              assert bounds is not None
              l,t,r,b = bounds
              assert l > 0 and t > 0 and r < im.width and b < im.height
              assert (r-l) / max(b-t, 1) >= 2.0, (im.size, bounds)
          print('HYBRID_OARFISH_SMOKE_OK actual_entity_dispatcher=1')
          PY

      - name: Render all Hybrid Aquatic baseline fish
        run: |
          set -euo pipefail
          rm -rf run/client/fishrender-output
          set +e
          timeout --signal=INT --kill-after=20s 22m xvfb-run -a gradle --no-daemon runRenderHybrid
          client_status=$?
          set -e
          if [ -f run/client/logs/latest.log ]; then
            grep -E 'FISHRENDER_(AUTO_|ENTITY_DIRECT)' run/client/logs/latest.log || true
            tail -n 180 run/client/logs/latest.log || true
          fi
          if [ "$client_status" -ne 0 ] && [ "$client_status" -ne 124 ] && [ "$client_status" -ne 130 ]; then
            exit "$client_status"
          fi
          grep -Eq -- '- hybrid[-_]aquatic 1\.5\.5' run/client/logs/latest.log

      - name: Validate source-authentic Hybrid Aquatic 1.5.5 renders
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          root = Path('run/client/fishrender-output')
          status = json.loads((root / 'generated/auto-export-status.json').read_text())
          report = json.loads((root / 'generated/render-report.json').read_text())
          late_only = {
              'hybrid_aquatic:blobfish',
              'hybrid_aquatic:cichlid',
              'hybrid_aquatic:trevally',
          }
          assert status['status'] == 'success' and status['mode'] == 'namespace:hybrid_aquatic', status
          assert status['total_fish'] == 49 and report['total_fish'] == 49, report
          assert report['successful'] + report['failed'] == 49, report
          assert report['successful'] >= 46, report.get('exceptions')
          failed_ids = {str(r.get('fish_id','')) for r in report.get('exceptions', [])}
          assert failed_ids <= late_only, report.get('exceptions')
          assert all(r.get('render_mode') == 'minecraft_entity_dispatcher' for r in report['successes'])

          renders = root / 'fish/assets/renders'
          pngs = sorted(renders.glob('hybrid_aquatic__*.png'))
          assert len(pngs) == report['successful'], (len(pngs), report['successful'])
          for png in pngs:
              with Image.open(png) as im:
                  assert im.mode == 'RGBA', (png.name, im.mode)
                  bounds = im.getchannel('A').getbbox()
                  assert bounds is not None, png.name
                  l,t,r,b = bounds
                  assert l > 0 and t > 0 and r < im.width and b < im.height, (png.name, im.size, bounds)
          summary = {
              'total_catalog': 49,
              'source_authentic_1_5_5': report['successful'],
              'baseline_failures': sorted(failed_ids),
          }
          (root / 'generated/hybrid-aquatic-validation-summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print('HYBRID_BASELINE_RUNTIME_VALID', summary)
          PY

      - name: Publish validated baseline renders without clobbering later-version evidence
        run: |
          set -euo pipefail
          cd ../../..
          out='tools/fish-render-export/TideFishRenderExporter/run/client/fishrender-output'
          rm -rf /tmp/hybrid-baseline-renders
          mkdir -p /tmp/hybrid-baseline-renders
          cp "$out"/fish/assets/renders/hybrid_aquatic__*.png /tmp/hybrid-baseline-renders/
          cp "$out"/generated/render-report.json /tmp/hybrid-baseline-render-report.json

          git fetch origin dev
          git reset --hard origin/dev
          mkdir -p fish/assets/renders
          cp /tmp/hybrid-baseline-renders/hybrid_aquatic__*.png fish/assets/renders/

          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/hybrid-baseline-render-report.json').read_text())
          manifest_path = Path('assets/fish-render-manifest.json')
          manifest = json.loads(manifest_path.read_text())
          fish = manifest.setdefault('fish', {})

          for row in report['successes']:
              fish_id = row['fish_id']
              ns, path = fish_id.split(':', 1)
              filename = ns + '__' + path.replace('/', '_').replace(':', '_') + '.png'
              fish[fish_id] = {
                  'source': 'Hybrid Aquatic 1.5.5 actual Minecraft EntityRenderDispatcher',
                  'entity': row.get('resolved_entity_id') or row.get('entity_id'),
                  'renderer_mode': row.get('render_mode'),
                  'source_mod_version': '1.5.5',
                  'source_modrinth_version_id': '6EfLaKkB',
                  'capture_orientation': 'side_profile_matrix_y_90_dispatcher_yaw_0',
                  'variants': {
                      'normal': {
                          'file': f'fish/assets/renders/{filename}',
                          'status': 'source_backed_runtime_entity'
                      }
                  }
              }

          failed_ids = {row['fish_id'] for row in report.get('exceptions', [])}
          unresolved = []
          for fish_id in sorted(failed_ids):
              existing_file = fish.get(fish_id, {}).get('variants', {}).get('normal', {}).get('file')
              if existing_file and Path(existing_file).is_file():
                  continue
              unresolved.append(fish_id)
              fish[fish_id] = {
                  'source': 'Hybrid Aquatic later-version runtime render pending',
                  'renderer_mode': 'pending_later_runtime_entity',
                  'source_mod_version': '1.5.5-missing-entity',
                  'variants': {'normal': {'status': 'pending_later_runtime_entity'}}
              }

          runtime = manifest.setdefault('hybridAquaticRuntime', {})
          runtime['baseline_version'] = '1.5.5'
          runtime['baseline_modrinth_version_id'] = '6EfLaKkB'
          runtime['baseline_validated'] = len(report['successes'])
          runtime['pending_later_runtime'] = unresolved
          manifest['generatedBy'] = 'Tide Fish Render Exporter + Minecraft EntityRenderDispatcher'
          manifest['pipelineStatus'] = 'source_authentic_runtime' if not unresolved else 'source_authentic_partial_runtime'
          counts = manifest.setdefault('counts', {})
          counts['supported_fish'] = len(fish)
          counts['normal'] = sum(1 for v in fish.values() if v.get('variants',{}).get('normal',{}).get('file'))
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')
          PY

          python scripts/validate-fish-render-manifest.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fish/assets/renders/hybrid_aquatic__*.png assets/fish-render-manifest.json
          if git diff --cached --quiet; then
            echo 'No baseline Hybrid Aquatic render changes to publish.'
          else
            git commit -m 'Publish validated Hybrid Aquatic baseline renders'
            git push origin HEAD:dev
          fi

      - name: Upload Hybrid Aquatic runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-aquatic-baseline-runtime-renders
          path: |
            tools/fish-render-export/TideFishRenderExporter/run/client/fishrender-output/
            tools/fish-render-export/TideFishRenderExporter/run/client/logs/
          if-no-files-found: warn
          retention-days: 14
