name: Publish dev preview

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-dev-preview
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev source
        uses: actions/checkout@v4
        with:
          ref: dev
          path: source
          fetch-depth: 1

      - name: Check out production main
        uses: actions/checkout@v4
        with:
          ref: main
          path: production
          fetch-depth: 1

      - name: Build isolated dev preview subtree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf production/dev
          mkdir -p production/dev

          # Copy only the static site surface. Development tooling, workflows,
          # repository docs, and source-build utilities do not belong in Pages.
          cp source/index.html production/dev/index.html
          cp -a source/assets production/dev/assets
          cp -a source/docs production/dev/docs
          cp -a source/fish production/dev/fish

          cat > production/dev/dev-preview.json <<EOF
          {
            "branch": "dev",
            "source_sha": "${GITHUB_SHA}",
            "published_by": "publish-dev-preview.yml"
          }
          EOF

      - name: Publish preview snapshot to main /dev
        shell: bash
        run: |
          set -euo pipefail
          cd production
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dev

          if git diff --cached --quiet; then
            echo "Dev preview is already current."
            exit 0
          fi

          git commit -m "Publish dev Pages preview ${GITHUB_SHA::7}"
          git push origin HEAD:main
