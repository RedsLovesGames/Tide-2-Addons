name: Package dev preview

on:
  push:
    branches:
      - dev
    paths:
      - index.html
      - assets/**
      - docs/**
      - fish/**
      - .github/workflows/publish-dev-preview.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-dev-preview
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev source
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1

      - name: Build isolated GitHub Pages-style preview artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf preview
          mkdir -p preview/Tide-2-Addons
          cp index.html preview/Tide-2-Addons/index.html
          cp -a assets preview/Tide-2-Addons/assets
          cp -a docs preview/Tide-2-Addons/docs
          cp -a fish preview/Tide-2-Addons/fish
          cat > preview/Tide-2-Addons/dev-preview.json <<EOF
          {
            "branch": "dev",
            "source_sha": "${GITHUB_SHA}",
            "packaged_by": "publish-dev-preview.yml",
            "production_branch_modified": false
          }
          EOF

      - name: Upload dev preview
        uses: actions/upload-artifact@v4
        with:
          name: tideborne-dev-preview-${{ github.sha }}
          path: preview/
          if-no-files-found: error
          retention-days: 14
