name: Build Tide Fish Runtime Exporter JAR

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/build-fish-render-exporter-jar.yml'
      - 'tools/fish-render-export/TideFishRenderExporter/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fish-runtime-exporter-jar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-jar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/fish-render-export/TideFishRenderExporter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-read-only: false

      - name: Build remapped drop-in JAR
        run: gradle --no-daemon clean build

      - name: Verify runtime-only drop-in JAR
        run: |
          set -euo pipefail
          JAR=$(find build/libs -maxdepth 1 -type f -name 'tide-fish-render-exporter-*.jar' ! -name '*-sources.jar' | head -1)
          test -n "$JAR"
          LIST=$(mktemp)
          jar tf "$JAR" > "$LIST"
          grep -F 'fabric.mod.json' "$LIST"
          for cls in RuntimeEnvironment RuntimeBundleAutoInitializer RuntimeBundleExporter RuntimeFishCatalog RuntimeFishDisplayExport TideborneVariantSupport ImageOps RenderFailureCode RenderFailureException; do
            grep -F "com/redslovesgames/tidefishrender/${cls}.class" "$LIST"
          done
          for legacy in TideFishRenderExporter RenderCommands RenderService RegistryLoader RenderReport RenderTargetOverride; do
            ! grep -Fq "com/redslovesgames/tidefishrender/${legacy}.class" "$LIST"
          done
          ! grep -Fq 'fishrender/fish-render-registry.json' "$LIST"
          echo "DROP_IN_JAR=$JAR"

      - uses: actions/upload-artifact@v4
        with:
          name: tide-fish-runtime-exporter-drop-in
          path: tools/fish-render-export/TideFishRenderExporter/build/libs/tide-fish-render-exporter-*.jar
          if-no-files-found: error
          retention-days: 14
