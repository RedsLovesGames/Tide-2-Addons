name: Inspect render source import payload

on:
  push:
    branches: [fish-render-source-import]
    paths:
      - '.github/workflows/inspect-render-source-payload.yml'
      - 'tools/fish-render-source/import-payload/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover partial payload metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, pathlib, zlib
          root=pathlib.Path('tools/fish-render-source/import-payload')
          chunks=sorted(root.glob('meta-*.b64'))
          if not chunks:
              raise SystemExit('No payload chunks found')
          encoded=''.join(p.read_text().strip() for p in chunks)
          raw=base64.b64decode(encoded)
          print('CHUNKS',len(chunks),'BASE64_CHARS',len(encoded),'DECODED_BYTES',len(raw))
          if raw[:2]==b'\x1f\x8b':
              dec=zlib.decompressobj(16+zlib.MAX_WBITS)
              data=dec.decompress(raw)
              print('PARTIAL_GZIP_BYTES',len(data),'EOF',dec.eof,'UNUSED',len(dec.unused_data))
          else:
              data=raw
          text=data.decode('utf-8',errors='replace')
          print('--- BEGIN HEAD ---')
          print(text[:60000])
          print('--- END HEAD ---')
          if len(text)>60000:
              print('--- BEGIN TAIL ---')
              print(text[-20000:])
              print('--- END TAIL ---')
          PY
