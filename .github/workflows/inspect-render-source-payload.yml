name: Finalize render source metadata

on:
  push:
    branches: [fish-render-source-import]
    paths:
      - '.github/workflows/inspect-render-source-payload.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fish-render-source-import
          fetch-depth: 0
      - name: Generate conservative source index and validate registries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('fish/render-data/registry')
          supported=json.loads((root/'supported-fish-registry.json').read_text())
          mods=json.loads((root/'mod-render-registry.json').read_text())
          fish=supported['fish']
          assert supported['fish_count']==182 == len(fish)
          ids=[f['fish_id'] for f in fish]
          assert len(ids)==len(set(ids)), 'duplicate fish ids'
          assert len(mods['mods'])==19
          assert sum(m['fish_count'] for m in mods['mods'])==182

          entries={}
          for f in fish:
              entries[f['fish_id']]={
                  'entity_id': f.get('entity_id'),
                  'source_entity_namespace': f.get('entity_namespace'),
                  'source_entity_jar': f.get('source_entity_jar'),
                  'source_registry_jar': f.get('source_registry_jar'),
                  'source_data_path': f.get('source_data_path'),
                  'renderer_strategy': f.get('renderer_strategy'),
                  'direct_candidates': [],
                  'shared_renderer_candidates': [],
                  'candidate_paths_status': 'not_recovered_from_truncated_source_archive'
              }
          index={
              'schema_version': 1,
              'entry_count': len(entries),
              'status': 'conservative_recovery',
              'generated_from': 'supported-fish-registry.json',
              'note': 'The original 635341-byte source-file index was the first incomplete TAR member in the staged archive. This replacement intentionally records only source-backed fields present in the verified supported registry and leaves model/texture/class candidate arrays empty rather than inventing paths.',
              'fish': entries
          }
          (root/'fish-source-file-index.json').write_text(json.dumps(index,indent=2,ensure_ascii=False)+'\n')

          manifest=json.loads(pathlib.Path('fish/render-data/manifest.json').read_text())
          assert manifest['counts']['supported_fish']==182
          assert manifest['counts']['render_mod_entries']==19
          for rel in manifest['registry'].values():
              p=pathlib.Path('fish/render-data')/rel
              assert p.is_file(), p
              json.loads(p.read_text())
          print('validated 182 unique supported fish, 19 render groups, and all four public JSON documents')
          PY
      - name: Commit generated source index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fish/render-data/registry/fish-source-file-index.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add conservative Fish Wiki source index'
          git push origin HEAD:fish-render-source-import
