name: Materialize specimen lab assets

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/materialize-specimen-lab-assets.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Create uniquely named lab assets
        run: |
          cp assets/fish-highlight-modal.js assets/fish-specimen-lab.js
          cp assets/fish-highlight-modal.css assets/fish-specimen-lab.css
          python - <<'PY'
          from pathlib import Path
          p = Path('fish/index.html')
          s = p.read_text()
          s = s.replace('../assets/fish-highlight-modal.css?v=2', '../assets/fish-specimen-lab.css?v=1')
          s = s.replace('../assets/fish-highlight-modal.js?v=2', '../assets/fish-specimen-lab.js?v=1')
          p.write_text(s)
          PY
      - name: Commit uncached assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/fish-specimen-lab.js assets/fish-specimen-lab.css fish/index.html
          git commit -m 'Use uncached specimen lab assets'
          git push origin HEAD:dev
